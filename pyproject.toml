[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pyitm"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.package-data]
itm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# Explicit so new ruff releases don't change the rule set under CI (0.16 widened the defaults).
select = ["E4", "E7", "E9", "F"]
