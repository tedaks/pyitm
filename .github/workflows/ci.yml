name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Every OS for the pure-Python suite ("OS Independent"); bit-identity with the C++
    # is only claimed for Linux, see the differential job below.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # Any open()/read_text() without an explicit encoding fails on every OS, not
        # just on Windows (whose default is cp1252).
        run: python -X warn_default_encoding -W error::EncodingWarning -m pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check pyitm_ng/
          ruff check tests/

      - name: Type check (mypy --strict, config in pyproject.toml)
        run: mypy

  min-deps:
    # Each Python against the oldest numpy the dependency floors allow (pyproject.toml).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python-version: "3.10", numpy: "1.21.2" }
          - { python-version: "3.11", numpy: "1.23.2" }
          - { python-version: "3.12", numpy: "1.26.0" }
          - { python-version: "3.13", numpy: "2.1.0" }
          - { python-version: "3.14", numpy: "2.3.2" }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the floor numpy, then the package
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==${{ matrix.numpy }}" pytest
          pip install -e .
          python -c "import numpy; assert numpy.__version__ == '${{ matrix.numpy }}', numpy.__version__"

      - name: Run tests
        run: pytest -q
  differential:
    # All four entry points vs the NTIA/itm C++ reference on random inputs, bit-identical
    # (ITM_DIFF_EXACT). Both architectures: aarch64 is where FMA contraction would bite.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build C++ reference
        run: echo "ITM_REFERENCE_LIB=$(tools/build_itm_reference.sh)" >> "$GITHUB_ENV"

      - name: Run differential tests
        env:
          ITM_DIFF_CASES: "5000"
          ITM_DIFF_EXACT: "1"
        run: pytest -v tests/test_differential.py
